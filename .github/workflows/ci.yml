name: CI

# Runs on pull requests and on the branches that deploy, so a type error or a
# failing test is caught here rather than halfway through deploy-stage.yml —
# where the build already runs on the VPS and a failure leaves the previous
# release serving while the workflow goes red.
on:
  pull_request:
  push:
    branches:
      - main
      - stage

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No packageManager field in package.json, so the version is pinned here.
      # Keep it in step with the pnpm on the VPS (currently 11.18.0).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same order the deploy uses: @ting/shared emits the types the other two
      # packages import, and the server cannot be typechecked before the Prisma
      # client is generated from schema.prisma.
      - name: Build @ting/shared
        run: pnpm --filter @ting/shared build

      - name: Generate Prisma client
        run: pnpm --filter @ting/server exec prisma generate

      # Covers the test files too, which the server's build config excludes.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # `pnpm test` runs vitest in watch mode when it has a TTY; `vitest run` is
      # explicit about exiting. The client's browser tests use a real Chromium
      # via Playwright and are left to `pnpm --filter @ting/client test:browser`.
      - name: Test server
        run: pnpm --filter @ting/server exec vitest run

      - name: Test client
        run: pnpm --filter @ting/client exec vitest run --config vitest.config.ts
